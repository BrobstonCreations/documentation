name: Generate PDF Documentation

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Version Number (e.g., 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install md-to-pdf
        run: npm install -g md-to-pdf

      - name: Convert Markdown to PDF
        run: |
          chmod +x ./scripts/generate-pdfs.sh
          ./scripts/generate-pdfs.sh

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: install-instructions/*.pdf
          tag_name: ${{ github.event.inputs.version_number || github.ref_name }}
          name: Release ${{ github.event.inputs.version_number || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
