name: Generate PDF Documentation

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Version Number (e.g., v1.0.5)'
        required: true
        default: 'v1.0.0'

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install md-to-pdf
        run: npm install -g md-to-pdf

      - name: Convert Markdown to PDF
        run: |
          mkdir -p output-pdfs

          # List files to verify directory structure in logs
          echo "Checking directory contents..."
          ls -R installation-instructions/

          # Find all .md files and convert them
          # We use find to ensure the shell expands the file list correctly
          find installation-instructions/ -name "*.md" -type f | while read -r file; do
            filename=$(basename "$file" .md)
            echo "Converting $file to output-pdfs/$filename.pdf"
            md-to-pdf "$file" > "output-pdfs/$filename.pdf"
          done

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: output-pdfs/*.pdf
          tag_name: ${{ github.event.inputs.version_number || github.ref_name }}
          name: Release ${{ github.event.inputs.version_number || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
